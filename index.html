<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard Creator</title>
<style>
 body{font-family:sans-serif;background:#17181c;color:#fff;padding:16px;max-width:600px;margin:auto}
 textarea{width:100%;height:160px;box-sizing:border-box;padding:10px;border-radius:8px;border:0;font-size:1rem}
 button{padding:12px 16px;margin:8px 6px 8px 0;border:0;border-radius:8px;font-size:1rem}
 .item{background:#262830;border-radius:8px;padding:10px;margin:6px 0;display:flex;gap:8px;justify-content:space-between}
 a{color:#7db7ff}
</style>
</head>
<body>
<h2>Flashcard Creator</h2>
<a href="viewer.html">Open viewer →</a>
<p>Paste AI text (one card per line as <code>Question :: Answer</code>, or Q:/A: pairs):</p>
<textarea id="input"></textarea>
<button id="gen">Make cards</button>
<h3>Deck (<span id="n">0</span>)</h3>
<div id="list"></div>
<button id="dl">Download cards.json</button>
<button id="clear">Clear deck</button>
<script src="app.js"></script>
</body>
</html>
